<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Một điều anh muốn nói</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    background: #b77171;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: .55;
    pointer-events: none;
  }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(
      circle,
      rgba(30,18,24,.10),
      rgba(0,0,0,.86)
    );
  }

  .content {
    width: min(90vw, 700px);
    text-align: center;
    text-shadow: 0 0 12px rgba(255,255,255,.16);
  }

  .eyebrow {
    margin-bottom: 18px;
    font-size: 15px;
    letter-spacing: 2px;
    color: #e6dfe2;
    opacity: .9;
  }

  .text {
    min-height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(28px, 7vw, 62px);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: .5px;
    transition: opacity .7s;
  }

  .sub {
    margin-top: 28px;
    font-size: clamp(14px, 3.5vw, 20px);
    color: #d8d0d4;
    line-height: 1.6;
    transition: opacity .7s;
  }

  button {
    margin-top: 28px;
    padding: 13px 24px;
    border: 1px solid rgba(255,255,255,.5);
    border-radius: 999px;
    background: rgba(255,255,255,.08);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    backdrop-filter: blur(5px);
    transition: .25s;
  }

  button:hover {
    background: rgba(255,255,255,.16);
    transform: translateY(-1px);
  }

  .primary {
    border-color: rgba(246,183,202,.55);
    background: rgba(246,183,202,.10);
  }

  #choices {
    display: none;
    margin-top: 24px;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  #answerYes,
  #answerWait {
    display: none;
  }

  #answerYes {
    color: #f6b7ca;
  }
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="overlay">
  <div class="content">

    <div class="eyebrow">Một điều anh muốn nói</div>

    <div id="text" class="text"></div>

    <div id="sub" class="sub"></div>

    <div id="choices">
      <button class="primary" onclick="answerYes()">
        ❤️ Em đồng ý
      </button>

      <button onclick="answerWait()">
        😳 Cho em thêm thời gian
      </button>
    </div>

    <div id="answerYes" class="sub">
      yêu dợ ❤️<br>
      Anh yêu cục kim cương của anh.
    </div>

    <div id="answerWait" class="sub">
      Không sao đâu. Anh không cần em phải trả lời ngay.<br>
      Khi nào em sẵn sàng, hãy nói cho anh biết nhé. ❤️
    </div>

    <button id="next" onclick="nextMessage()">
      Tiếp tục ❤️
    </button>

    <!--
      File nhạc music.mp3 phải nằm cùng thư mục với index.html.
      Trình duyệt sẽ thử tự phát nhạc.
    -->
    <audio id="bgMusic" autoplay loop preload="auto">
      <source src="music.mp3" type="audio/mpeg">
    </audio>

  </div>
</div>

<script>

/* =====================================================
   NỘI DUNG
===================================================== */

const messages = [
  {
    main: "Anh nghĩ thời gian vừa qua là đủ để anh hiểu bản thân anh muốn gì trong mối quan hệ này",
    sub: "Nên hôm nay anh muốn em đọc điều này trước."
  },
  {
    main: "Anh đã suy nghĩ khá lâu.",
    sub: "Anh không muốn làm em áp lực, nhưng anh cũng không muốn sau này phải tiếc vì đã im lặng."
  },
  {
    main: "Anh thích em.",
    sub: "Càng nói chuyện và tìm hiểu em, anh càng muốn được bước gần em hơn."
  },
  {
    main: "Anh muốn được tìm hiểu em nghiêm túc hơn.",
    sub: "Không cần một lời hứa thật lớn. Chỉ cần em cho anh một cơ hội."
  },
  {
    main: "Để anh làm một nửa của em nhé ❤️",
    sub: "Em không cần trả lời ngay. Anh chỉ muốn em biết điều anh thật sự cảm thấy."
  }
];


/* =====================================================
   HIỂN THỊ LỜI NHẮN
===================================================== */

let index = 0;

const textEl = document.getElementById("text");
const subEl = document.getElementById("sub");
const nextBtn = document.getElementById("next");
const choicesEl = document.getElementById("choices");
const answerYesEl = document.getElementById("answerYes");
const answerWaitEl = document.getElementById("answerWait");

function showMessage(i) {

  textEl.style.opacity = 0;
  subEl.style.opacity = 0;

  setTimeout(() => {

    textEl.textContent = messages[i].main;
    subEl.textContent = messages[i].sub;

    if (i === messages.length - 1) {

      textEl.style.color = "#f6b7ca";
      textEl.style.textShadow =
        "0 0 18px rgba(246,183,202,.28)";

      nextBtn.style.display = "none";
      choicesEl.style.display = "flex";

    } else {

      textEl.style.color = "#fff";
      textEl.style.textShadow =
        "0 0 12px rgba(255,255,255,.16)";

      nextBtn.style.display = "inline-block";
      choicesEl.style.display = "none";
      nextBtn.textContent = "Tiếp tục ❤️";
    }

    textEl.style.opacity = 1;
    subEl.style.opacity = 1;

  }, 250);
}


function nextMessage() {

  if (index < messages.length - 1) {
    index++;
    showMessage(index);
  }

}


/* =====================================================
   CÂU TRẢ LỜI
===================================================== */

function answerYes() {

  choicesEl.style.display = "none";
  answerWaitEl.style.display = "none";
  answerYesEl.style.display = "block";

}


function answerWait() {

  choicesEl.style.display = "none";
  answerYesEl.style.display = "none";
  answerWaitEl.style.display = "block";

}


/* =====================================================
   NHẠC NỀN
   Không có nút bật/tắt.
   Thử autoplay trước.
   Nếu trình duyệt chặn autoplay thì khi người dùng
   click lần đầu vào trang, nhạc sẽ được phát.
===================================================== */

const bgMusic = document.getElementById("bgMusic");

async function startMusic() {

  try {

    await bgMusic.play();

  } catch (error) {

    // Chrome/Edge có thể chặn autoplay có tiếng.
    // Chờ người dùng tương tác lần đầu.

    document.addEventListener(
      "click",
      playMusicAfterInteraction,
      { once: true }
    );

  }

}


function playMusicAfterInteraction() {

  bgMusic.play().catch(() => {});

}

startMusic();


/* =====================================================
   HIỂU ỨNG MATRIX
===================================================== */

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

const chars =
  "01アイウエオカキクケコサシスセソABCDEFGHIJKLMNOPQRSTUVWXYZ";

let fontSize = 13;
let columns;
let drops;


function resize() {

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  columns = Math.floor(canvas.width / fontSize);

  drops = Array(columns).fill(1);

}


resize();

window.addEventListener("resize", resize);


function draw() {

  ctx.fillStyle = "rgba(0,0,0,0.11)";
  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.shadowBlur = 0;
  ctx.font = "bold " + fontSize + "px monospace";


  for (let i = 0; i < drops.length; i++) {

    const char =
      chars[Math.floor(Math.random() * chars.length)];


    if (Math.random() < 0.13) {

      ctx.fillStyle = "#ff99cc";
      ctx.shadowColor = "rgba(243,182,200,.28)";
      ctx.shadowBlur = 3;

    } else {

      ctx.fillStyle =
        Math.random() < 0.55
          ? "#d9d9d9"
          : "#9a9a9a";

      ctx.shadowColor =
        "rgba(255,255,255,.10)";

      ctx.shadowBlur = 1;

    }


    ctx.fillText(
      char,
      i * fontSize,
      drops[i] * fontSize
    );


    if (
      drops[i] * fontSize > canvas.height &&
      Math.random() > 0.978
    ) {
      drops[i] = 0;
    }


    drops[i]++;

  }

}


setInterval(draw, 32);


/* =====================================================
   KHỞI ĐỘNG
===================================================== */

showMessage(0);

</script>

</body>
</html>
